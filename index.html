<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending somewhere in the web</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Animation Layer -->
    <div class="ambient-background"></div>

    <header>
        <h1>Trend <span> Tracker</span></h1>
        <p>Streaming insights from various web pages such as HackerNews posts and Github repositories</p>
        
        <!-- Controls Container -->
        <div class="controls-container">
            <!-- Date Filter -->
            <div class="date-wrapper">
                <label for="date-filter">Retrieval Date:</label>
                <input type="date" id="date-filter">
                <button id="clear-date-btn" title="Clear Date Filter (Show All)">↺</button>
            </div>

            <!-- Tag Filters -->
            <div id="filter-container">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </header>

    <main>
        <div id="card-grid" class="bento-grid">
            <!-- Cards injected by JS -->
        </div>
        
        <!-- Empty State Message -->
        <div id="no-results" style="display:none;">
            <p>No updates found for this date.</p>
            <button onclick="document.getElementById('clear-date-btn').click()" class="reset-link">View all time</button>
        </div>

        <div id="scroll-sentinel"></div>
    </main>

    <footer>
        <div class="footer-content">
            <!-- <p>&copy; 2026 Knowledge Stream.</p> -->
            <p><a href="https://github.com/emreg00/n8n-local">emreg00/TrendTracker</a> - v1.0 - 2026 - powered by:</p>
            <div class="footer-links">
                <a href="https://n8n.io/">n8n</a>
                <a href="https://ollama.com/">Ollama</a>
                <a href="https://docs.github.com/en/pages/getting-started-with-github-pages/creating-a-github-pages-site">GitHub pages</a>
                
            </div>
        </div>
    </footer>

    <!-- Card Template -->
    <template id="card-template">
        <article class="card">
            <div class="card-header">
                <span class="card-date"></span>
                <a href="#" target="_blank" class="card-link">Visit &nearr;</a>
            </div>
            <h2 class="card-url"></h2>
            <div class="content-wrapper">
                <ul class="card-summary"></ul>
            </div>
            <div class="card-tags"></div>
        </article>
    </template>

    <script src="script.js"></script>
</body>
</html>
